services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: capstone_kb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    ports: ["8000:8000"]
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/capstone_kb
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      BASE_URL: ${BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      ALEMBIC_AUTO_MIGRATE: "true"
    
volumes: 
  pgdata: