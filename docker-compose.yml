services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: capstone_kb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    ports: ["8000:8000"]
    depends_on: [db]
    environment: 
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/capstone_kb
    
volumes: 
  pgdata: